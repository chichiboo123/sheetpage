[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Google Sheets export proxy — the browser cannot call Google directly.
[[redirects]]
  from = "/api/gsheets"
  to = "/.netlify/functions/gsheets"
  status = 200
  force = true

# Share snapshot storage.
[[redirects]]
  from = "/api/share"
  to = "/.netlify/functions/share"
  status = 200
  force = true

# A share snapshot is somebody's spreadsheet reached by an unguessable link.
# Keeping it out of search indexes stops one shared link from turning into a
# public, searchable copy of their data.
[[headers]]
  for = "/s/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# SPA fallback — must be last so /s/:id reaches the client router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
