<!doctype html><html lang="ko"><head><meta charset="utf-8"/><style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased}
  .og{width:1200px;height:630px;background:#fff;padding:74px 78px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .logo{display:flex;align-items:center;gap:16px}
  .logo svg{width:52px;height:52px;display:block}
  .logo .n{font-size:36px;font-weight:800;letter-spacing:-.02em;color:#171A18}
  h1{margin-top:52px;font-size:76px;font-weight:800;line-height:1.18;letter-spacing:-.03em;color:#171A18}
  p{margin-top:26px;font-size:30px;font-weight:500;line-height:1.55;color:#565D59}
  .strip{position:absolute;right:-40px;bottom:-30px;width:560px;border:3px solid #E2E5E3;border-radius:18px;overflow:hidden;transform:rotate(-3deg);background:#fff}
  .row{display:flex;height:52px;border-bottom:3px solid #EFF1F0}
  .row.h{background:#F7F8F7;font-weight:700;color:#3F4643;border-bottom:3px solid #E2E5E3}
  .c{border-right:3px solid #EFF1F0;padding:0 18px;display:flex;align-items:center;font-size:22px;color:#3F4643;white-space:nowrap;overflow:hidden}
  .num{width:60px;justify-content:flex-end;background:#F7F8F7;color:#9BA39E;font-size:19px}
  .on{background:#DCEDE3;color:#0F3123;font-weight:700}
  .url{margin-top:auto;font-size:28px;font-weight:700;color:#1A573D;letter-spacing:-.01em}
</style></head><body>
<div class="og" id="og">
  <div class="logo">
    <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#1F6B4A"/><rect x="7" y="8" width="18" height="16" rx="2" fill="#fff"/><rect x="7" y="8" width="18" height="4" fill="#8CC3A5"/><rect x="13" y="12" width="1.4" height="12" fill="#DCEDE3"/><rect x="19" y="12" width="1.4" height="12" fill="#DCEDE3"/><rect x="7" y="16" width="18" height="1.4" fill="#DCEDE3"/><rect x="7" y="20" width="18" height="1.4" fill="#DCEDE3"/></svg>
    <span class="n">SheetPage</span>
  </div>
  <h1>Spreadsheet를<br/>Page처럼.</h1>
  <p>복잡한 Excel과 Google Sheets를<br/>웹페이지처럼 편하게 탐색하세요.</p>
  <div class="url">sheetpage.chichiboo.link</div>
  <div class="strip">
    <div class="row h"><div class="c num"></div><div class="c" style="width:230px">항목</div><div class="c" style="width:150px">담당</div><div class="c" style="flex:1">시수</div></div>
    <div class="row"><div class="c num">1</div><div class="c" style="width:230px">1. 수와 연산</div><div class="c" style="width:150px">김교사</div><div class="c" style="flex:1">12</div></div>
    <div class="row on"><div class="c num">2</div><div class="c" style="width:230px">2. 도형</div><div class="c" style="width:150px">이교사</div><div class="c" style="flex:1">9</div></div>
    <div class="row"><div class="c num">3</div><div class="c" style="width:230px">3. 측정</div><div class="c" style="width:150px">박교사</div><div class="c" style="flex:1">11</div></div>
    <div class="row"><div class="c num">4</div><div class="c" style="width:230px">4. 규칙성</div><div class="c" style="width:150px">최교사</div><div class="c" style="flex:1">8</div></div>
    <div class="row"><div class="c num">5</div><div class="c" style="width:230px">5. 자료와 가능성</div><div class="c" style="width:150px">정교사</div><div class="c" style="flex:1">10</div></div>
  </div>
</div>
</body></html>
